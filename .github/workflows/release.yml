name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="$GITHUB_REF_NAME"
          app="src-tauri/target/release/bundle/macos/Computer Usage Tracker.app"
          dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
          tar=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          sig="${tar[0]}.sig"
          mkdir -p dist
          cp "${dmg[0]}" "dist/ComputerUsageTracker-${version}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/ComputerUsageTracker-${version}.zip"
          cp "${tar[0]}" "dist/ComputerUsageTracker-${version}.app.tar.gz"
          notes="Download ComputerUsageTracker-${version}.dmg, open it, and drag Computer Usage Tracker into Applications.

          Open the app, then enable hourly background tracking in Settings."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/ComputerUsageTracker-${version}.dmg" "dist/ComputerUsageTracker-${version}.zip" "dist/ComputerUsageTracker-${version}.app.tar.gz" --clobber
          else
            gh release create "$tag" "dist/ComputerUsageTracker-${version}.dmg" "dist/ComputerUsageTracker-${version}.zip" "dist/ComputerUsageTracker-${version}.app.tar.gz" --title "Computer Usage Tracker ${tag}" --notes "$notes"
          fi
          sig_b64="$(tr -d '[:space:]' < "$sig")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/ComputerUsageTracker-${version}.app.tar.gz"
          node -e '
            const fs = require("fs");
            const [version, notes, sig, url] = process.argv.slice(1);
            fs.writeFileSync("dist/latest.json", JSON.stringify({
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": { signature: sig, url } },
            }, null, 2) + "\n");
          ' "$version" "$notes" "$sig_b64" "$url"
          gh release upload "$tag" dist/latest.json --clobber
