[package]
name = "work-hours-tracker"
version = "0.1.9"
description = "Automatic daily computer usage tracker for macOS"
edition = "2021"
default-run = "work-hours-tracker"

[[bin]]
name = "work-hours-tracker"
path = "src/main.rs"

[[bin]]
name = "wht-track"
path = "src/bin/wht-track.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
